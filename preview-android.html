<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
  :root{
    --blue:#2b8fc4; --blue-dark:#1c6e9c; --green:#6fce62; --green-dark:#3fa34d;
    --navy:#17324a; --gold:#c9a227; --bg:#f2f7fb; --card:#ffffff;
    --muted:#5b7183; --line:#e3edf3; --danger:#e5484d;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--navy); padding-bottom:96px;}
  header.hero{background:linear-gradient(135deg,#7fb9d9 0%,#5aa9d6 35%,#6fce62 100%);
    color:#fff; padding:24px 20px 18px; text-align:center; position:relative; overflow:hidden;}
  header.hero h1{margin:0; font-size:30px; letter-spacing:.5px; font-weight:800; text-shadow:0 1px 2px rgba(0,0,0,.15);}
  header.hero h1 .accent{color:#eafbe4;}
  header.hero p{margin:6px 0 0; font-size:13px; letter-spacing:2px; opacity:.95; font-weight:600;}
  header.hero .sub{margin-top:8px; font-size:13px; letter-spacing:.5px; opacity:.9; font-weight:400;}
  main{max-width:560px; margin:0 auto; padding:0 14px;}
  .card{background:var(--card); border-radius:16px; padding:16px; margin-top:14px;
    box-shadow:0 2px 10px rgba(23,50,74,.07); border:1px solid var(--line);}
  .card h2{margin:0 0 10px; font-size:15px; letter-spacing:.4px; color:var(--navy);}

  /* profile tabs */
  .tabs{display:flex; gap:8px; margin-top:14px; overflow-x:auto; padding-bottom:2px;}
  .tab{flex:1; min-width:120px; border:2px solid var(--line); background:#fff; border-radius:12px;
    padding:10px 12px; cursor:pointer; text-align:left; font-family:inherit;}
  .tab.active{border-color:var(--blue); background:#f0f8fd;}
  .tab .nm{font-weight:700; font-size:15px; display:flex; align-items:center; gap:6px;}
  .dot{width:10px; height:10px; border-radius:50%; display:inline-block;}
  .tab .mi{font-size:12px; color:var(--muted); margin-top:2px;}

  /* stats */
  .big{font-size:44px; font-weight:800; line-height:1;}
  .big small{font-size:16px; font-weight:600; color:var(--muted);}
  .bar{height:12px; background:#e8f1f6; border-radius:99px; margin:12px 0 4px; overflow:hidden;}
  .bar > div{height:100%; border-radius:99px; background:linear-gradient(90deg,var(--blue),var(--green));
    transition:width .5s ease;}
  .pct{font-size:13px; color:var(--muted); font-weight:600;}
  .statgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px;}
  .stat{background:#f6fafd; border:1px solid var(--line); border-radius:12px; padding:8px 4px; text-align:center;}
  .stat .v{font-size:17px; font-weight:800;}
  .stat .l{font-size:9px; color:var(--muted); margin-top:2px; letter-spacing:.3px; line-height:1.35;}
  #statsTitle{margin-bottom:4px;}

  .gchip .dot{margin-right:2px;}
  .gchip.active.c20{border-color:#3fa34d; background:#e9f7ec; color:#2f7a3a;}
  .gchip.active.c50{border-color:var(--blue); background:#eaf5fc; color:var(--blue-dark);}
  .gchip.active.c100{border-color:#e5484d; background:#fdecec; color:#b3272e;}
  .cbtn{border:2px solid var(--line); background:#fff; border-radius:99px; min-width:44px; padding:10px 14px;
    font-size:12.5px; font-weight:800; cursor:pointer; font-family:inherit; color:var(--muted);}
  .cbtn.on.c20{border-color:#3fa34d; background:#e9f7ec; color:#2f7a3a;}
  .cbtn.on.c50{border-color:var(--blue); background:#eaf5fc; color:var(--blue-dark);}
  .cbtn.on.c100{border-color:#e5484d; background:#fdecec; color:#b3272e;}
  .chrow{display:flex; gap:6px; align-items:center; margin-top:6px;}
  .chrow .cl{font-size:11.5px; color:var(--muted); font-weight:700; margin-right:2px;}
  .nudge{display:none; background:#fff8e1; border:1px solid #ffe082; color:#7a5c00; border-radius:12px;
    padding:8px 12px; margin-top:10px; font-size:13px; font-weight:600; line-height:1.45;}
  .nudge a{color:#b3272e; font-weight:800;}
  .nudge.top{margin:0; border-radius:0; border-left:0; border-right:0; border-top:0; text-align:center;}
  .coach-line{font-size:14px; line-height:1.55; margin:6px 0;}
  .coach-line:first-child{margin-top:0;} .coach-line:last-child{margin-bottom:0;}
  .coach-big{font-size:15px; font-weight:800;}
  .coach-ok{color:#2f7a3a;} .coach-warn{color:#b3272e;} .coach-mid{color:#8a6d00;}
  /* slim verse strip */
  .verse-strip{margin-top:10px; padding:10px 14px;
    background:linear-gradient(135deg,#fdf6e3,#fbeed1); border:1px solid #ecd9a8; border-radius:14px;}
  .verse-strip .vtext{font-size:13.5px; line-height:1.5; font-style:italic; color:#4a3c14;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .verse-strip .vmeta{font-size:11.5px; color:#8a6d1a; margin-top:3px; font-weight:700;}
  .verse-strip .vmeta .vtimer{color:var(--muted); font-weight:400;}
  /* bubbles */
  .bubbles{display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-top:6px;}
  .bub{aspect-ratio:1; border-radius:50%; border:2px solid #d8b93c; color:#b8932a; background:#fffdf4;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; cursor:pointer;
    -webkit-tap-highlight-color:transparent; user-select:none;}
  .bub.done{border-color:transparent; color:#fff; background:linear-gradient(135deg,var(--blue),var(--green));
    box-shadow:0 2px 6px rgba(43,143,196,.35);}
  .bub.done.c20{background:linear-gradient(135deg,#6fce62,#2f9e44); box-shadow:0 2px 6px rgba(63,163,77,.35);}
  .bub.done.c50{background:linear-gradient(135deg,#5aa9d6,#6fce62); box-shadow:0 2px 6px rgba(43,143,196,.35);}
  .bub.done.c100{background:linear-gradient(135deg,#ff8787,#c92a2a); box-shadow:0 2px 6px rgba(201,42,42,.35);}
  .bubbles.c20{grid-template-columns:repeat(5,1fr);}
  .bubbles.c100{grid-template-columns:repeat(10,1fr); gap:6px;}
  .bubbles.c100 .bub{font-size:11px; border-width:1.5px;}
  /* toggle switches */
  .switchrow{display:flex; align-items:center; justify-content:space-between; padding:10px 2px; font-weight:600; font-size:15px;}
  .switch{position:relative; width:46px; height:26px; flex:none;}
  .switch input{opacity:0; width:100%; height:100%; position:absolute; margin:0; cursor:pointer; z-index:2;}
  .switch .sl{position:absolute; inset:0; background:#cfd6dd; border-radius:999px; transition:.2s;}
  .switch .sl:before{content:''; position:absolute; width:20px; height:20px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .switch input:checked + .sl{background:var(--green);}
  .switch input:checked + .sl:before{transform:translateX(20px);}
  /* activity chip icon tap animation */
  .chip .aicon{display:inline-block;}
  .chip .aicon.pop{animation:chipPop .55s ease;}
  @keyframes chipPop{0%{transform:scale(1) rotate(0);}35%{transform:scale(1.5) rotate(-14deg);}70%{transform:scale(.92) rotate(8deg);}100%{transform:scale(1) rotate(0);}}
  .complete-badge{background:linear-gradient(135deg,var(--gold),#f0c94a); color:#5c430a; font-weight:800;
    text-align:center; border-radius:12px; padding:10px; margin-top:12px;}

  /* form */
  label.fl{display:block; font-size:12.5px; font-weight:700; color:var(--muted); margin:12px 0 6px; letter-spacing:.3px;}
  label.fl:first-child{margin-top:0;}
  input[type=date],input[type=number],input[type=text],input[type=url],input[type=password],textarea{
    width:100%; padding:12px; font-size:16px; border:2px solid var(--line); border-radius:12px; font-family:inherit;
    color:var(--navy); background:#fff;}
  input:focus,textarea:focus{outline:none; border-color:var(--blue);}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{border:2px solid var(--line); background:#fff; border-radius:99px; padding:9px 14px; font-size:14px;
    font-weight:600; cursor:pointer; font-family:inherit; color:var(--navy);}
  .chip.active{border-color:var(--blue); background:#eaf5fc; color:var(--blue-dark);}
  .milesrow{display:flex; gap:8px; align-items:stretch;}
  .stepper{width:52px; border:2px solid var(--line); background:#fff; border-radius:12px; font-size:22px;
    cursor:pointer; color:var(--blue-dark); font-weight:700;}
  .btn{width:100%; margin-top:14px; padding:14px; border:none; border-radius:14px; font-size:16px; font-weight:800;
    color:#fff; background:linear-gradient(135deg,var(--blue),var(--green-dark)); cursor:pointer; font-family:inherit;}
  .btn:active{transform:scale(.98);}
  .btn.secondary{background:#fff; color:var(--blue-dark); border:2px solid var(--blue); margin-top:8px;}
  .btn.danger{background:#fff; color:var(--danger); border:2px solid var(--danger);}

  /* leaderboard */
  .lbrow{margin-bottom:12px;}
  .lbrow:last-child{margin-bottom:0;}
  .lbrow .top{display:flex; justify-content:space-between; font-size:14px; font-weight:700; margin-bottom:6px;}
  .lbrow .top .sc{color:var(--muted); font-weight:600;}
  .ahead{font-size:12px; color:var(--green-dark); font-weight:700; margin-top:4px;}

  /* entries */
  .entry{display:flex; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line);}
  .entry:last-child{border-bottom:none;}
  .eicon{font-size:22px; width:40px; height:40px; border-radius:12px; background:#f0f8fd;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .einfo{flex:1; min-width:0;}
  .einfo .t{font-weight:700; font-size:14.5px;}
  .einfo .d{font-size:12px; color:var(--muted);}
  .emi{font-weight:800; font-size:15px; white-space:nowrap;}
  .eact{background:none; border:none; font-size:16px; cursor:pointer; padding:6px; color:var(--muted);}
  .empty{color:var(--muted); font-size:14px; text-align:center; padding:18px 0;}

  /* settings */
  #settingsBtn{position:fixed; right:16px; bottom:16px; width:56px; height:56px; border-radius:50%;
    border:none; background:var(--navy); color:#fff; font-size:24px; cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.25); z-index:40;}
  .modal{position:fixed; inset:0; background:rgba(23,50,74,.5); display:none; z-index:50;
    align-items:flex-end; justify-content:center;}
  .modal.open{display:flex;}
  .sheet{background:#fff; width:100%; max-width:560px; border-radius:20px 20px 0 0; padding:20px;
    max-height:88vh; overflow-y:auto;}
  .sheet h2{margin:0 0 4px; font-size:18px;}
  .sheet h3{font-size:14px; margin:20px 0 8px; color:var(--navy);}
  .sheet .hint{font-size:13px; color:var(--muted); margin:0 0 8px; line-height:1.45;}
  .prow{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line);}
  .prow .nm{flex:1; font-weight:700;}
  .prow button{border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 10px;
    font-size:13px; cursor:pointer; font-family:inherit;}
  .status{font-size:13px; margin-top:8px; font-weight:600;}
  .status.ok{color:var(--green-dark);} .status.err{color:var(--danger);}
  .closeRow{display:flex; justify-content:flex-end;}
  .closeRow button{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);}

  #toast{position:fixed; left:50%; bottom:84px; transform:translateX(-50%) translateY(20px); background:var(--navy);
    color:#fff; padding:12px 18px; border-radius:12px; font-size:14px; font-weight:600; opacity:0;
    transition:all .25s; pointer-events:none; z-index:60; max-width:90vw; text-align:center;}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  #confetti{position:fixed; inset:0; pointer-events:none; display:none; z-index:55;}
  .foot{text-align:center; color:var(--muted); font-size:12px; margin-top:18px; line-height:1.6;}
</style></head><body><div style="max-width:480px;margin:0 auto;padding:20px;opacity:.35;filter:blur(2px)"><div style="background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.08)"><h3 style="margin:0 0 8px">October Challenge</h3><p style="color:#5b7183">Your tracker with 32 miles logged. Keep going!</p></div></div><div class="modal open" style="display:flex"><div class="sheet"><h2>📲 Install the app</h2><p class="hint">Add October Challenge to your home screen for one-tap access — just like a real app.</p><button class="btn" type="button">Install app</button><button class="btn secondary" type="button">Not now</button></div></div></body></html>
